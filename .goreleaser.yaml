version: 2
project_name: whodar

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: whodar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/kordloom/whodar/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

dockers:
  - image_templates:
      - "ghcr.io/kordloom/whodar:{{ .Version }}-amd64"
    dockerfile: Dockerfile.release
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/kordloom/whodar"
      - "--label=org.opencontainers.image.licenses=BUSL-1.1"
  - image_templates:
      - "ghcr.io/kordloom/whodar:{{ .Version }}-arm64"
    dockerfile: Dockerfile.release
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/kordloom/whodar"
      - "--label=org.opencontainers.image.licenses=BUSL-1.1"

docker_manifests:
  - name_template: "ghcr.io/kordloom/whodar:{{ .Version }}"
    image_templates:
      - "ghcr.io/kordloom/whodar:{{ .Version }}-amd64"
      - "ghcr.io/kordloom/whodar:{{ .Version }}-arm64"
  - name_template: "ghcr.io/kordloom/whodar:latest"
    image_templates:
      - "ghcr.io/kordloom/whodar:{{ .Version }}-amd64"
      - "ghcr.io/kordloom/whodar:{{ .Version }}-arm64"

homebrew_casks:
  - name: whodar
    # Auto-publish the cask to the tap when a write-scoped token is available as
    # TAP_GITHUB_TOKEN. Without it the release still succeeds and the cask is
    # simply not pushed, so a missing secret never breaks a release.
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: kordloom
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://whodar.dev"
    description: "Know who knows. Find who to talk to about X across your work tools."
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/whodar"]
          end

release:
  # The GitHub release and its generated notes are created by
  # `gh release create --generate-notes` before this runs, so keep that release
  # and only attach the build artifacts to it. Replace existing artifacts so a
  # re-run of a release publishes cleanly instead of failing on a name clash.
  mode: keep-existing
  replace_existing_artifacts: true
