# Run whodar in a container. Pick a profile:
#   Demo:    docker compose --profile demo up --build -d
#   Public:  TUNNEL_TOKEN=... docker compose --profile tunnel up --build -d
#   Serve:   WHODAR_SERVE_TOKEN=... docker compose --profile serve up --build -d
# The demo is a self-contained tour of a simulated company across all eight
# sources: seeded, open, no secrets, discarded when it stops. The tunnel profile
# publishes that same demo at a public hostname through Cloudflare, TLS and DNS
# included. Serve is the real web UI over an index you build into ./data.
services:
  demo:
    build: .
    profiles: ["demo", "tunnel"]
    command: ["demo", "--addr", ":8765"]
    ports:
      # Bind the host port to loopback only. Under the tunnel profile the demo is
      # reached through Cloudflare over the compose network at http://demo:8765,
      # so publishing it on the box's public interface would let anyone reach it
      # directly, bypassing the tunnel. Loopback keeps it local for a browser on
      # the host. Set WHODAR_PORT to move the local port.
      - "127.0.0.1:${WHODAR_PORT:-8765}:8765"

  # A Cloudflare Tunnel that publishes the demo with TLS and no open ports or
  # hand-managed DNS. One-time setup in the Cloudflare Zero Trust dashboard:
  # create a tunnel, add a public hostname (demo.whodar.dev) routed to the
  # service http://demo:8765, and copy the tunnel token into TUNNEL_TOKEN (a
  # .env file works). Cloudflare terminates TLS and creates the DNS record.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:-}"]
    depends_on: [demo]
    restart: unless-stopped

  serve:
    build: .
    profiles: ["serve"]
    command: ["serve", "--addr", ":8765", "--data-dir", "/data"]
    environment:
      # whodar refuses to bind beyond localhost without this token, and every
      # request must then carry it as a bearer header or token query parameter.
      WHODAR_SERVE_TOKEN: ${WHODAR_SERVE_TOKEN:-}
    volumes:
      # Holds index.json and the files whodar writes back, such as feedback.
      # The image runs as nonroot, so this directory must be writable by it.
      - ./data:/data
    ports:
      - "${WHODAR_PORT:-8765}:8765"
